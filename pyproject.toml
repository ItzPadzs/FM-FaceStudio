[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-facestudio"
version = "2.4.0b1"
description = "Football Manager face research and generation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ItzPadzs"}]
dependencies = ["PySide6==6.8.2.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
training = ["torch>=2.4", "torchvision>=0.19", "Pillow>=10.4"]

[project.scripts]
fm-facestudio = "facestudio.app:main"
fm-facestudio-donors = "facestudio.donor_index_cli:main"
fm-facestudio-2 = "facestudio.facestudio2_cli:main"
fm-facestudio-train = "facestudio.training.portrait_uv:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
