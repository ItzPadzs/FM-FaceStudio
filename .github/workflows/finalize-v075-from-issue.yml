      - name: Run browser application tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest -r "$SOURCE_ROOT/browser_app/requirements.txt"
          cd "$SOURCE_ROOT/browser_app"
          python -m pytest tests -q

      - name: Replace legacy repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE_ROOT"/. .

          test -f RUN.bat
          test -f UPDATE_AND_RUN.bat
          test -d browser_app
          test ! -e .bootstrap
          test ! -e launcher.py
          test ! -e src
          test ! -e bridge
          test ! -e data
          test ! -e docs
          test ! -e examples
          test ! -e INSTALL_AND_OPEN.bat
          test ! -e RUN_LEGACY.bat

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Repository already matches recovered browser baseline."
            exit 0
          fi
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
