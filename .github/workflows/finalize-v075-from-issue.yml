name: Inspect v0.75 Staging Payloads

on:
  push:
    branches:
      - facestudio-v0.75-browser-baseline
    paths:
      - '.bootstrap/finalize-v075-now.txt'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing payload sets
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          for d in .bootstrap/v075_tree .bootstrap/v075_full .bootstrap/v075_payload2 .bootstrap/v075_publish16 .bootstrap/v075_safe; do
            echo "=== $d ==="
            parts=("$d"/*.b64)
            echo "parts=${#parts[@]}"
            [ ${#parts[@]} -gt 0 ] || continue
            cat "${parts[@]}" > /tmp/payload.b64
            echo "b64_bytes=$(wc -c < /tmp/payload.b64)"
            if base64 --decode /tmp/payload.b64 > /tmp/payload.bin 2>/tmp/err; then
              echo "decoded_bytes=$(wc -c < /tmp/payload.bin)"
              sha256sum /tmp/payload.bin
              file /tmp/payload.bin
              if tar -tJf /tmp/payload.bin >/tmp/list 2>/dev/null; then
                echo "tar_xz=YES files=$(wc -l < /tmp/list)"
                head -20 /tmp/list
              elif unzip -l /tmp/payload.bin >/tmp/list 2>/dev/null; then
                echo "zip=YES"
                tail -5 /tmp/list
              else
                echo "archive=NO"
              fi
            else
              echo "base64=BAD"
              cat /tmp/err
            fi
          done
