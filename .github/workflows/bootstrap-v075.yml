name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths: ['.github/workflows/bootstrap-v075.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct clean v0.75 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/69/comments?per_page=100" > /tmp/pages.json
          python - <<'PY'
          import base64, json, shutil, zipfile
          from pathlib import Path
          pages=json.loads(Path('/tmp/pages.json').read_text())
          rows=[r for p in pages for r in p]
          clean={}; final0=None
          for r in rows:
              b=(r.get('body') or '').strip()
              if b.startswith('V075CLEAN:'):
                  _,i,x=b.split(':',2); clean[int(i)]=x.strip()
              elif b.startswith('V075FINAL:0:'):
                  final0=b.split(':',2)[2].strip()
          if sorted(clean)!=list(range(1,13)) or not final0:
              raise SystemExit(f'Unexpected staged payload: clean={sorted(clean)}, final0={bool(final0)}')
          variants={
              'splice10': final0[:10000]+''.join(clean[i] for i in range(1,13)),
              'splice20': final0+''.join(clean[i] for i in range(2,13)),
          }
          chosen=None
          for name,enc in variants.items():
              try: data=base64.b64decode(enc,validate=True)
              except Exception as e: print(name,'decode',e); continue
              p=Path('/tmp/'+name+'.zip'); p.write_bytes(data)
              print(name,'bytes',len(data),'iszip',zipfile.is_zipfile(p))
              if not zipfile.is_zipfile(p): continue
              try:
                  with zipfile.ZipFile(p) as z:
                      bad=z.testzip(); names=z.namelist()
                  print(name,'files',len(names),'bad',bad)
                  required=['RUN.bat','UPDATE_AND_RUN.bat','browser_app/run_windows.bat','browser_app/app/main.py','browser_app/app/engine/hair_matcher.py','browser_app/app/static/index.html','.github/workflows/browser-app.yml']
                  score=sum(any(n.endswith(q) for n in names) for q in required)
                  print(name,'score',score)
                  if score==7 and bad is None:
                      chosen=p; break
              except Exception as e: print(name,'ziperr',e)
          if chosen is None: raise SystemExit('Spliced clean archive is not valid')
          root=Path('/tmp/v075-src'); shutil.rmtree(root,ignore_errors=True); root.mkdir()
          with zipfile.ZipFile(chosen) as z: z.extractall(root)
          roots=list(root.iterdir())
          if len(roots)==1 and roots[0].is_dir() and not (root/'browser_app').exists(): root=roots[0]
          required=[root/'RUN.bat',root/'UPDATE_AND_RUN.bat',root/'browser_app'/'run_windows.bat',root/'browser_app'/'app'/'main.py',root/'browser_app'/'app'/'engine'/'hair_matcher.py',root/'browser_app'/'app'/'static'/'index.html',root/'.github'/'workflows'/'browser-app.yml']
          missing=[str(p.relative_to(root)) for p in required if not p.is_file()]
          if missing: raise SystemExit('Missing: '+','.join(missing))
          if any(p.exists() for p in [root/'launcher.py',root/'RUN_LEGACY.bat',root/'src']): raise SystemExit('Legacy desktop paths present')
          if '0.75.0' not in (root/'browser_app'/'app'/'main.py').read_text(errors='replace'): raise SystemExit('Wrong version')
          Path('/tmp/source-root.txt').write_text(str(root))
          PY

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/source-root.txt)"
          python -m compileall -q browser_app/app browser_app/tools
          python -m pip install -q -r browser_app/requirements.txt pytest
          python -m pytest browser_app/tests -q

      - name: Replace migration branch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/source-root.txt)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
