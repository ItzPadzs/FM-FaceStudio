name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths:
      - '.github/workflows/bootstrap-v075.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover final v0.75 browser source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5605357000" > /tmp/final-comment.json
          python - <<'PY'
          import base64, hashlib, json, shutil, zipfile
          from pathlib import Path

          row = json.loads(Path('/tmp/final-comment.json').read_text(encoding='utf-8'))
          body = (row.get('body') or '').strip()
          prefix = 'V075FINAL:0:'
          if not body.startswith(prefix):
              raise SystemExit('Final recovery payload marker not found')

          encoded = body[len(prefix):].strip()
          data = base64.b64decode(encoded, validate=True)
          print('ZIP_BYTES', len(data))
          print('SHA256', hashlib.sha256(data).hexdigest())

          zpath = Path('/tmp/v075-final.zip')
          zpath.write_bytes(data)
          out = Path('/tmp/v075-src')
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True)
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              z.extractall(out)

          files = [p for p in out.rglob('*') if p.is_file()]
          print('SOURCE_FILES', len(files))
          required = [
              out/'RUN.bat',
              out/'UPDATE_AND_RUN.bat',
              out/'browser_app'/'run_windows.bat',
              out/'browser_app'/'app'/'main.py',
              out/'browser_app'/'app'/'engine'/'hair_matcher.py',
              out/'browser_app'/'app'/'static'/'index.html',
              out/'.github'/'workflows'/'browser-app.yml',
          ]
          missing = [str(p.relative_to(out)) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          forbidden = [out/'launcher.py', out/'RUN_LEGACY.bat', out/'src']
          present = [str(p.relative_to(out)) for p in forbidden if p.exists()]
          if present:
              raise SystemExit('Legacy desktop paths present: ' + ', '.join(present))

          main_text = (out/'browser_app'/'app'/'main.py').read_text(encoding='utf-8', errors='replace')
          index_text = (out/'browser_app'/'app'/'static'/'index.html').read_text(encoding='utf-8', errors='replace')
          if '0.75.0' not in main_text or '0.75.0' not in index_text:
              raise SystemExit('Recovered source is not the v0.75.0 browser baseline')
          PY

      - name: Replace legacy tree with browser-only source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v075-src/. .
          test -f browser_app/app/main.py
          test -f browser_app/app/engine/hair_matcher.py
          test -f browser_app/app/static/index.html
          test ! -e launcher.py
          test ! -e RUN_LEGACY.bat
          test ! -e src

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q browser_app/app browser_app/tools
          python -m pip install -q -r browser_app/requirements.txt pytest
          python -m pytest browser_app/tests -q

      - name: Commit clean browser baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
