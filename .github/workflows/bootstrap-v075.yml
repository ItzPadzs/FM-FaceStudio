name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths: ['.github/workflows/bootstrap-v075.yml']

permissions:
  contents: write
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect recoverable browser source
        shell: bash
        run: |
          set -euo pipefail
          echo "Inspecting v0.75 recovery payload"
          gh api "repos/${GITHUB_REPOSITORY}/issues/69/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import base64,json,struct,zlib
          from pathlib import Path
          rows=json.loads(Path('/tmp/comments.json').read_text())
          parts={}
          for row in rows:
              body=(row.get('body') or '').strip()
              if body.startswith('V075ZIP:'):
                  try:
                      _,idx,payload=body.split(':',2); parts[int(idx)]=payload.strip()
                  except Exception: pass
          have=sorted(k for k in parts if isinstance(k,int))
          print('PAYLOAD_CHUNKS',have)
          raw=base64.b64decode(''.join(parts[i] for i in range(5)))
          print('PARTIAL_ZIP_BYTES',len(raw))
          pos=0; complete=[]
          while pos+30 <= len(raw) and raw[pos:pos+4]==b'PK\x03\x04':
              vals=struct.unpack_from('<4s5H3I2H',raw,pos)
              _,ver,flag,method,tm,dt,crc,csize,usize,nlen,xlen=vals
              name=raw[pos+30:pos+30+nlen].decode('utf-8','replace')
              start=pos+30+nlen+xlen; end=start+csize
              if end>len(raw):
                  print('TRUNCATED_ENTRY',name,'need',end-len(raw),'more bytes'); break
              data=raw[start:end]
              try:
                  out=zlib.decompress(data,-15) if method==8 else data
                  if len(out)!=usize: raise ValueError(f'{len(out)} != {usize}')
              except Exception as e:
                  print('BAD_ENTRY',name,e); break
              complete.append((name,usize,csize))
              pos=end
          print('COMPLETE_COUNT',len(complete))
          for name,usize,csize in complete: print('COMPLETE',name,usize,csize)
          print('NEXT_OFFSET',pos,'REMAINING',len(raw)-pos)
          PY
