name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths:
      - '.github/workflows/bootstrap-v075.yml'
      - '.bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified browser source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/v075x.part00
          gh api "repos/${GITHUB_REPOSITORY}/issues/69/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, json, zipfile
          from pathlib import Path

          rows = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          parts = {}
          for row in rows:
              body = (row.get('body') or '').strip()
              if not body.startswith('V075CLEAN:'):
                  continue
              try:
                  _, idx, payload = body.split(':', 2)
                  i = int(idx)
              except Exception:
                  continue
              payload = payload.strip()
              if i == 0 and payload == 'placeholder':
                  continue
              parts[i] = payload

          # Part 00 was accidentally overwritten in the issue; restore it from
          # the byte-identical Git blob recovered from the earlier transfer.
          parts[0] = Path('.bootstrap/v075x.part00').read_text(encoding='ascii').strip()
          needed = list(range(22))
          missing = [i for i in needed if i not in parts]
          print('FOUND_PARTS', sorted(parts))
          if missing:
              raise SystemExit(f'Missing payload parts: {missing}')

          encoded = ''.join(parts[i] for i in needed)
          data = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(data).hexdigest()
          expected_sha = '28834a6d7a6b1d8bad8d0b5af710bd9707db7c9adbea19c767eef4174999681f'
          print('ZIP_BYTES', len(data))
          print('SHA256', digest)
          if digest != expected_sha:
              raise SystemExit(f'SHA mismatch: {digest} != {expected_sha}')

          zpath = Path('/tmp/v075.zip')
          zpath.write_bytes(data)
          out = Path('/tmp/v075-src')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              z.extractall(out)

          files = [p for p in out.rglob('*') if p.is_file()]
          print('SOURCE_FILES', len(files))
          if len(files) != 68:
              raise SystemExit(f'Expected 68 source files, found {len(files)}')

          required = [
              out/'RUN.bat',
              out/'UPDATE_AND_RUN.bat',
              out/'browser_app'/'run_windows.bat',
              out/'browser_app'/'app'/'main.py',
              out/'browser_app'/'app'/'engine'/'hair_matcher.py',
              out/'.github'/'workflows'/'browser-app.yml',
          ]
          missing = [str(p.relative_to(out)) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))

          forbidden = [out/'launcher.py', out/'RUN_LEGACY.bat', out/'src']
          present = [str(p.relative_to(out)) for p in forbidden if p.exists()]
          if present:
              raise SystemExit('Legacy desktop paths present: ' + ', '.join(present))
          PY

      - name: Replace legacy tree with browser-only source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v075-src/. .
          test -f browser_app/app/main.py
          test -f browser_app/app/engine/hair_matcher.py
          test ! -e launcher.py
          test ! -e RUN_LEGACY.bat
          test ! -e src

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q browser_app/app browser_app/tools
          python -m pip install -q -r browser_app/requirements.txt pytest
          python -m pytest browser_app/tests -q

      - name: Commit clean browser baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
