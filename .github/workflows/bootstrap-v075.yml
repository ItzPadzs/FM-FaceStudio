name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths: ['.github/workflows/bootstrap-v075.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover complete staged browser archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/69/comments?per_page=100" > /tmp/pages.json
          python - <<'PY'
          import base64, hashlib, json, re, shutil, zipfile
          from pathlib import Path

          pages=json.loads(Path('/tmp/pages.json').read_text(encoding='utf-8'))
          rows=[r for page in pages for r in page]
          rx=re.compile(r'^(V075[A-Z0-9_]*):(\d+):(.*)$', re.S)
          fam={}
          for r in rows:
              m=rx.match((r.get('body') or '').strip())
              if m:
                  fam.setdefault(m.group(1),{})[int(m.group(2))]=m.group(3).strip()
          print('FAMILIES', {k:(sorted(v),{i:len(x) for i,x in sorted(v.items())}) for k,v in fam.items()})

          candidates=[]
          for name,parts in fam.items():
              inds=sorted(parts)
              if not inds or inds[0]!=0 or inds!=list(range(inds[-1]+1)):
                  continue
              try:
                  data=base64.b64decode(''.join(parts[i] for i in inds), validate=True)
              except Exception as e:
                  print(name,'BASE64_FAIL',e); continue
              p=Path(f'/tmp/{name}.zip'); p.write_bytes(data)
              print(name,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest(),'ZIP',zipfile.is_zipfile(p))
              if not zipfile.is_zipfile(p):
                  continue
              try:
                  with zipfile.ZipFile(p) as z:
                      bad=z.testzip()
                      names=set(z.namelist())
                  if bad:
                      print(name,'BAD_MEMBER',bad); continue
                  score=sum(any(n.endswith(req) for n in names) for req in [
                      'RUN.bat','UPDATE_AND_RUN.bat','browser_app/run_windows.bat',
                      'browser_app/app/main.py','browser_app/app/engine/hair_matcher.py',
                      'browser_app/app/static/index.html','.github/workflows/browser-app.yml'])
                  print(name,'FILES',len(names),'SCORE',score)
                  candidates.append((score,len(data),name,p))
              except Exception as e:
                  print(name,'ZIP_FAIL',e)

          if not candidates:
              raise SystemExit('No complete valid staged v0.75 ZIP family found')
          candidates.sort(reverse=True)
          score,_,name,zpath=candidates[0]
          if score < 7:
              raise SystemExit(f'Best ZIP {name} missing required browser baseline files (score {score}/7)')
          print('SELECTED',name)

          root=Path('/tmp/v075-src'); shutil.rmtree(root,ignore_errors=True); root.mkdir()
          with zipfile.ZipFile(zpath) as z: z.extractall(root)
          roots=list(root.iterdir())
          if len(roots)==1 and roots[0].is_dir() and not (root/'browser_app').exists(): root=roots[0]

          required=[root/'RUN.bat',root/'UPDATE_AND_RUN.bat',root/'browser_app'/'run_windows.bat',
                    root/'browser_app'/'app'/'main.py',root/'browser_app'/'app'/'engine'/'hair_matcher.py',
                    root/'browser_app'/'app'/'static'/'index.html',root/'.github'/'workflows'/'browser-app.yml']
          missing=[str(p.relative_to(root)) for p in required if not p.is_file()]
          if missing: raise SystemExit('Missing required files: '+', '.join(missing))
          forbidden=[root/'launcher.py',root/'RUN_LEGACY.bat',root/'src']
          present=[str(p.relative_to(root)) for p in forbidden if p.exists()]
          if present: raise SystemExit('Legacy desktop paths present: '+', '.join(present))
          if '0.75.0' not in (root/'browser_app'/'app'/'main.py').read_text(errors='replace'):
              raise SystemExit('main.py is not v0.75.0')
          Path('/tmp/source-root.txt').write_text(str(root))
          PY

      - name: Replace legacy tree
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/source-root.txt)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          test -f browser_app/app/main.py
          test -f browser_app/app/engine/hair_matcher.py
          test ! -e launcher.py
          test ! -e RUN_LEGACY.bat
          test ! -e src

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q browser_app/app browser_app/tools
          python -m pip install -q -r browser_app/requirements.txt pytest
          python -m pytest browser_app/tests -q

      - name: Commit clean browser baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
