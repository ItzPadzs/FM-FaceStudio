name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths: ['.github/workflows/bootstrap-v075.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate v0.75 browser source in repository history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          python - <<'PY'
          import subprocess
          from pathlib import Path

          def run(*args):
              return subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          refs=run('git','for-each-ref','--format=%(refname)','refs/remotes/origin').stdout.splitlines()
          req=['RUN.bat','UPDATE_AND_RUN.bat','browser_app/run_windows.bat','browser_app/app/main.py',
               'browser_app/app/engine/hair_matcher.py','browser_app/app/static/index.html',
               '.github/workflows/browser-app.yml']
          candidates=[]
          for ref in refs:
              if ref.endswith('/HEAD'): continue
              ok=True
              for p in req:
                  if run('git','cat-file','-e',f'{ref}:{p}').returncode:
                      ok=False; break
              if not ok: continue
              main=run('git','show',f'{ref}:browser_app/app/main.py').stdout
              index=run('git','show',f'{ref}:browser_app/app/static/index.html').stdout
              if '0.75.0' in main and ('0.75.0' in index or 'Hair Matcher' in index):
                  candidates.append(ref)
          print('V075_CANDIDATES',candidates)
          if not candidates:
              # Diagnostic: show refs containing a Hair Matcher implementation or v0.75 marker anywhere.
              for ref in refs:
                  if ref.endswith('/HEAD'): continue
                  g=run('git','grep','-l','0.75.0',ref)
                  if g.stdout.strip(): print('VERSION_HITS',ref,g.stdout[:4000])
                  h=run('git','grep','-l','Hair Matcher',ref)
                  if h.stdout.strip(): print('HAIR_HITS',ref,h.stdout[:4000])
              raise SystemExit('No complete v0.75 browser source branch found')
          # Prefer the dedicated browser feature branch, otherwise newest candidate by commit timestamp.
          preferred=[r for r in candidates if r.endswith('/feature/hair-matcher-browser')]
          if preferred:
              ref=preferred[0]
          else:
              ref=max(candidates,key=lambda r:int(run('git','show','-s','--format=%ct',r).stdout.strip() or 0))
          print('SELECTED_REF',ref)
          Path('/tmp/source-ref.txt').write_text(ref)
          PY

      - name: Assemble clean browser-only tree
        shell: bash
        run: |
          set -euo pipefail
          REF="$(cat /tmp/source-ref.txt)"
          rm -rf /tmp/v075-src && mkdir -p /tmp/v075-src
          paths=(RUN.bat UPDATE_AND_RUN.bat browser_app .github/workflows/browser-app.yml)
          for p in .gitignore README.md; do
            if git cat-file -e "$REF:$p" 2>/dev/null; then paths+=("$p"); fi
          done
          git archive "$REF" -- "${paths[@]}" | tar -x -C /tmp/v075-src
          test -f /tmp/v075-src/browser_app/app/main.py
          test -f /tmp/v075-src/browser_app/app/engine/hair_matcher.py
          test -f /tmp/v075-src/browser_app/app/static/index.html
          grep -q '0.75.0' /tmp/v075-src/browser_app/app/main.py
          test ! -e /tmp/v075-src/launcher.py
          test ! -e /tmp/v075-src/RUN_LEGACY.bat
          test ! -e /tmp/v075-src/src

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v075-src
          python -m compileall -q browser_app/app browser_app/tools
          python -m pip install -q -r browser_app/requirements.txt pytest
          python -m pytest browser_app/tests -q

      - name: Replace migration branch with clean browser baseline
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v075-src/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
