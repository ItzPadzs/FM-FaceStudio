name: Bootstrap v0.75 Browser Baseline

on:
  push:
    branches:
      - facestudio-v0.75-browser-baseline
    paths:
      - '.bootstrap/v075_full/**'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean browser source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/v075_full/*.b64)
          if [ "${#parts[@]}" -ne 13 ]; then
            echo "Waiting for all 13 source chunks; currently have ${#parts[@]}."
            exit 0
          fi

          cat .bootstrap/v075_full/*.b64 | base64 --decode > /tmp/facestudio-v075.tar.xz
          mkdir -p /tmp/facestudio-v075
          tar -xJf /tmp/facestudio-v075.tar.xz -C /tmp/facestudio-v075

          # Replace the active repository tree completely. Keep only Git metadata.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/facestudio-v075/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
