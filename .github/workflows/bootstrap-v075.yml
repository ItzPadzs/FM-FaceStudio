name: Recover v0.75 Browser Baseline

on:
  push:
    branches: [facestudio-v0.75-browser-baseline]
    paths: ['.github/workflows/bootstrap-v075.yml']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct clean v0.75 archive from recovery issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/69/comments?per_page=100" > /tmp/pages.json
          python - <<'PY'
          import base64
          import hashlib
          import json
          import re
          import shutil
          import zipfile
          from pathlib import Path, PurePosixPath

          pages = json.loads(Path('/tmp/pages.json').read_text(encoding='utf-8'))
          rows = [row for page in pages for row in page]

          parts = {}
          for row in rows:
              body = (row.get('body') or '').strip()
              m = re.match(r'^V075FINAL:0:(.*)$', body, re.S)
              if m:
                  parts[0] = m.group(1).strip()
              m = re.match(r'^V075CLEAN:(\d+):(.*)$', body, re.S)
              if m:
                  index = int(m.group(1))
                  if index != 0:
                      parts[index] = m.group(2).strip()

          expected = list(range(13))
          missing = [i for i in expected if i not in parts]
          unexpected = sorted(i for i in parts if i not in expected)
          if missing:
              raise SystemExit(f'Missing v0.75 archive chunks: {missing}')
          if unexpected:
              raise SystemExit(f'Unexpected v0.75 archive chunks: {unexpected}')

          for i in expected:
              print('CHUNK', i, 'B64_CHARS', len(parts[i]))
          encoded = ''.join(parts[i] for i in expected)
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          print('ARCHIVE_BYTES', len(archive))
          print('ARCHIVE_SHA256', digest)

          zip_path = Path('/tmp/FM-FaceStudio-v0.75-clean-github-v2.zip')
          zip_path.write_bytes(archive)
          source = Path('/tmp/v075-source')
          shutil.rmtree(source, ignore_errors=True)
          source.mkdir(parents=True)

          try:
              zf = zipfile.ZipFile(zip_path)
          except Exception as exc:
              raise SystemExit(f'Reconstructed archive is not a complete ZIP: {exc}')
          with zf:
              print('ZIP_MEMBERS', len(zf.infolist()))
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              for info in zf.infolist():
                  raw = info.filename.replace('\\', '/').lstrip('/')
                  p = PurePosixPath(raw)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
              zf.extractall(source)

          children = [p for p in source.iterdir() if p.name != '__MACOSX']
          if len(children) == 1 and children[0].is_dir() and not (source / 'browser_app').exists():
              root = children[0]
          else:
              root = source

          required = [
              root / 'RUN.bat',
              root / 'UPDATE_AND_RUN.bat',
              root / '.github' / 'workflows' / 'browser-app.yml',
              root / 'browser_app' / 'run_windows.bat',
              root / 'browser_app' / 'requirements.txt',
              root / 'browser_app' / 'app' / 'main.py',
              root / 'browser_app' / 'app' / 'engine' / 'hair_matcher.py',
              root / 'browser_app' / 'app' / 'static' / 'index.html',
          ]
          missing_files = [str(p.relative_to(root)) for p in required if not p.is_file()]
          if missing_files:
              raise SystemExit('Archive is missing required files: ' + ', '.join(missing_files))

          main_text = (root / 'browser_app' / 'app' / 'main.py').read_text(encoding='utf-8', errors='replace')
          html_text = (root / 'browser_app' / 'app' / 'static' / 'index.html').read_text(encoding='utf-8', errors='replace')
          if '0.75.0' not in main_text:
              raise SystemExit('main.py is not v0.75.0')
          if 'v0.75.0' not in html_text:
              raise SystemExit('index.html is not v0.75.0')

          forbidden = [
              'RUN_LEGACY.bat', 'launcher.py', 'src', 'templates', 'pyproject.toml',
              'INSTALL_AND_OPEN.bat', 'bridge', 'data', 'docs', 'examples',
              'facestudio-donor-2002042595.json',
              'facestudio-fm-head-geometry.json',
              'facestudio-landmarks.json', '.bootstrap'
          ]
          present = [name for name in forbidden if (root / name).exists()]
          if present:
              raise SystemExit('Clean archive still contains legacy root paths: ' + ', '.join(present))

          Path('/tmp/source-root.txt').write_text(str(root), encoding='utf-8')
          PY

      - name: Validate v0.75 source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/source-root.txt)"
          cd "$SRC/browser_app"
          python -m pip install -q -r requirements.txt pytest
          python -m compileall -q app tools
          python -m pytest tests -q

      - name: Replace legacy repository with browser v0.75
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(cat /tmp/source-root.txt)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          rm -rf .bootstrap

          test -f browser_app/app/main.py
          test -f browser_app/app/engine/hair_matcher.py
          test -f browser_app/app/static/index.html
          test ! -e launcher.py
          test ! -e RUN_LEGACY.bat
          test ! -e src
          test ! -e bridge
          test ! -e data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Repository already matches clean v0.75 baseline.'
            exit 0
          fi
          git commit -m "Replace legacy desktop app with v0.75 browser FaceStudio"
          git push origin HEAD:facestudio-v0.75-browser-baseline
